<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Visual PRD · 离线评审容器</title>
  <style>
    :root {
      --left-width: 360px;
      --right-width: 360px;
      --header-height: 72px;
      --ink: #172033;
      --muted: #667085;
      --line: #e4e8ef;
      --panel: #ffffff;
      --canvas: #eef1f5;
      --accent: #5b5bd6;
      --accent-soft: #efefff;
      --success: #16855b;
      --warning: #b54708;
      --shadow: 0 18px 50px rgba(23, 32, 51, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--canvas); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app-shell {
      display: grid;
      grid-template-rows: var(--header-height) minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 18px;
      color: #fff;
      background: #171a2b;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { display: block; width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .brand-copy { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 750; letter-spacing: .01em; }
    .brand-subtitle { margin-top: 1px; color: #aeb4ca; font-size: 11px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .save-state { color: #aeb4ca; font-size: 12px; white-space: nowrap; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      transition: 150ms ease;
    }
    .button:hover { border-color: #c6cbd6; transform: translateY(-1px); }
    .button:focus-visible { outline: 3px solid rgba(124,119,255,.28); outline-offset: 1px; }
    .button-dark {
      color: #f7f7fb;
      border-color: #383c50;
      background: #282c40;
    }
    .button-dark:hover { border-color: #545a75; }
    .button-dark[aria-pressed="true"] { color: #fff; border-color: #7772f4; background: #514cc3; }
    .topbar-actions .button { min-height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; }
    .topbar-actions .icon { width: 14px; height: 14px; }
    .button-quiet { min-height: 30px; padding: 0 9px; color: var(--muted); background: #f8f9fb; }
    .icon { width: 16px; height: 16px; flex: none; }

    .workspace {
      display: grid;
      grid-template-columns: var(--left-width) 7px minmax(0, 1fr) 7px var(--right-width);
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-inner { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 55px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .panel-title { margin: 0; font-size: 14px; font-weight: 760; }
    .panel-scroll { min-height: 0; overflow: auto; overscroll-behavior: contain; }

    .resizer {
      position: relative;
      z-index: 20;
      cursor: col-resize;
      background: #e8ebf0;
      touch-action: none;
    }
    .resizer::after {
      content: "";
      position: absolute;
      inset: 0 2px;
      background: transparent;
      transition: 150ms ease;
    }
    .resizer:hover::after, .resizer.is-dragging::after { background: var(--accent); }

    .doc-navigation { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 12px 8px; }
    .doc-tab {
      min-width: 0;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: #f6f7f9;
      font-size: 12px;
      cursor: pointer;
    }
    .doc-tab[aria-selected="true"] { color: #3f3aa8; border-color: #d9d7ff; background: var(--accent-soft); font-weight: 700; }

    .doc-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 12px 10px; }
    .doc-context { color: var(--muted); font-size: 11px; }
    .segmented { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: #eef0f4; }
    .segmented button { padding: 5px 8px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 11px; cursor: pointer; }
    .segmented button[aria-pressed="true"] { color: var(--ink); background: #fff; box-shadow: 0 1px 3px rgba(23,32,51,.11); }

    .markdown-surface { padding: 8px 18px 80px; }
    .markdown-editor {
      min-height: calc(100vh - 190px);
      padding: 16px;
      border: 1px solid #d8dce4;
      border-radius: 10px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #293044;
      background: #fbfcfd;
      font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .markdown-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,91,214,.12); }
    .markdown-preview { color: #31384c; font-size: 13px; line-height: 1.72; }
    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3, .markdown-preview h4, .markdown-preview h5, .markdown-preview h6 { color: #141827; line-height: 1.3; }
    .markdown-preview h1 { margin: 12px 0 20px; font-size: 22px; }
    .markdown-preview h2 { margin: 25px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 16px; }
    .markdown-preview h3 { margin: 18px 0 8px; font-size: 14px; }
    .markdown-preview h4 { margin: 16px 0 7px; font-size: 13px; }
    .markdown-preview h5 { margin: 14px 0 6px; font-size: 12px; }
    .markdown-preview h6 { margin: 12px 0 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .markdown-preview p { margin: 8px 0; }
    .markdown-preview ul, .markdown-preview ol { padding-left: 22px; }
    .markdown-preview code { padding: 2px 5px; border-radius: 5px; color: #443fa8; background: #f0f2f5; font: .9em/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .markdown-preview pre { padding: 12px; overflow: auto; border-radius: 9px; color: #f1f2f7; background: #202437; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .markdown-preview pre code { padding: 0; color: inherit; background: none; }
    .mermaid-diagram { margin: 12px 0; padding: 12px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .mermaid-diagram svg { display: block; max-width: none; height: auto; margin: auto; }
    .mermaid-error { color: #b42318; }
    .markdown-preview blockquote { margin: 12px 0; padding: 8px 12px; border-left: 3px solid var(--accent); color: var(--muted); background: #f7f7ff; }
    .markdown-preview hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
    .markdown-preview table { width: 100%; margin: 12px 0 18px; border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; border-radius: 9px; overflow: hidden; font-size: 12px; }
    .markdown-preview th, .markdown-preview td { padding: 9px 11px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .markdown-preview th { color: #3f4658; background: #f2f3f7; font-weight: 750; }
    .markdown-preview th:last-child, .markdown-preview td:last-child { border-right: 0; }
    .markdown-preview tbody tr:last-child td { border-bottom: 0; }
    .markdown-preview tbody tr:nth-child(even) { background: #fafbfc; }

    .canvas-panel { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
    .canvas-shell { display: grid; grid-template-rows: 46px minmax(0, 1fr); height: 100%; }
    .canvas-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 13px;
      border-bottom: 1px solid #d9dde4;
      color: var(--muted);
      background: #f8f9fb;
    }
    .canvas-meta { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #20a66a; box-shadow: 0 0 0 3px rgba(32,166,106,.13); }
    .canvas-path { overflow: hidden; color: var(--ink); text-overflow: ellipsis; white-space: nowrap; }
    .scope-chip { padding: 3px 7px; border-radius: 999px; color: #4b46ad; background: #e7e6ff; font-size: 10px; font-weight: 700; }
    .canvas-stage { position: relative; min-height: 0; padding: 18px; overflow: hidden; }
    .device-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid #d4d8e0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(23,32,51,.11);
    }
    #prototype-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    #annotation-layer { position: absolute; inset: 18px; z-index: 8; pointer-events: none; }
    .anno-dot {
      position: absolute;
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 4px 13px rgba(63,58,168,.42);
      font-size: 11px;
      font-weight: 800;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .anno-dot:hover, .anno-dot.is-active { background: #262166; transform: translate(-50%, -50%) scale(1.08); }
    .anno-dot.is-missing { background: var(--warning); opacity: .72; }

    .annotation-popover {
      position: absolute;
      z-index: 15;
      width: min(310px, calc(100% - 24px));
      padding: 14px 15px;
      border: 1px solid rgba(91,91,214,.25);
      border-radius: 12px;
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .popover-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .popover-index { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 7px; border-radius: 50%; color: #fff; background: var(--accent); font-size: 11px; }
    .popover-title { margin: 0; font-size: 13px; }
    .popover-close { width: 25px; height: 25px; border: 0; border-radius: 6px; color: var(--muted); background: #f1f3f6; cursor: pointer; }
    .popover-body { margin: 9px 0 0; color: #50586b; font-size: 12px; line-height: 1.55; }
    .popover-meta { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font: 10px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }

    .annotation-summary { padding: 11px 13px; border-bottom: 1px solid var(--line); color: var(--muted); background: #fafbfc; font-size: 11px; }
    .annotation-list { display: grid; gap: 10px; padding: 12px 12px 70px; }
    .annotation-card {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 9px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: 150ms ease;
    }
    .annotation-card:hover, .annotation-card.is-active { border-color: #aaa6f4; background: #fbfaff; box-shadow: 0 5px 16px rgba(56,52,142,.08); }
    .annotation-number { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; background: var(--accent); font-size: 11px; font-weight: 800; }
    .annotation-card h3 { margin: 1px 0 5px; font-size: 12px; }
    .annotation-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; white-space: pre-line; }
    .annotation-rules { margin-top: 8px; color: #50586b; font-size: 11px; line-height: 1.5; }
    .annotation-rules strong { color: var(--ink); }
    .annotation-rules ul { margin: 4px 0 0; padding-left: 17px; }
    .annotation-card footer { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .tag { padding: 3px 6px; border-radius: 5px; color: #596174; background: #f0f2f5; font-size: 9px; }
    .tag.scope-page { color: #175cd3; background: #eff8ff; }
    .tag.scope-tab { color: #6941c6; background: #f4f3ff; }
    .tag.scope-modal { color: #b54708; background: #fff4ed; }
    .empty-state { padding: 38px 20px; color: var(--muted); text-align: center; font-size: 12px; }

    .floating-mode .workspace { grid-template-columns: minmax(0, 1fr); }
    .floating-mode .left-panel,
    .floating-mode .right-panel,
    .floating-mode .resizer { display: none; }
    .floating-mode .canvas-stage { padding: 24px; }
    .floating-mode #annotation-layer { inset: 24px; }

    .ui-configurator {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: flex;
      justify-content: flex-end;
      background: rgba(15, 23, 42, .42);
    }
    .ui-config-drawer {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: min(430px, calc(100vw - 24px));
      height: 100%;
      color: var(--ink);
      background: #fff;
      box-shadow: -20px 0 60px rgba(23, 32, 51, .22);
    }
    .ui-config-head, .ui-config-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .ui-config-head h2 { margin: 0; font-size: 16px; }
    .ui-config-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .ui-config-close { width: 32px; height: 32px; border: 0; border-radius: 8px; color: var(--muted); background: #f1f3f6; cursor: pointer; }
    .ui-config-scope { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .ui-config-scope .segmented { width: 100%; }
    .ui-config-scope .segmented button { flex: 1; }
    .ui-config-status { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .ui-config-form { min-height: 0; padding: 8px 16px 28px; overflow: auto; }
    .ui-config-group { margin: 16px 0 20px; }
    .ui-config-group h3 { margin: 0 0 10px; font-size: 12px; }
    .ui-config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ui-config-field { display: grid; gap: 5px; color: #41495c; font-size: 11px; }
    .ui-config-field span::after { content: ""; }
    .ui-config-field.is-inherited span::after { content: " · 沿用全局"; color: #8a91a3; }
    .ui-config-field.is-shadowed span::after { content: " · 当前页已覆盖"; color: #b26a00; }
    .ui-config-field.is-locked span::after { content: " · 模型已固定"; color: #8a91a3; }
    .ui-config-field.is-unavailable span::after { content: " · 当前页无此组件"; color: #8a91a3; }
    .ui-config-field.is-current-locked span::after { content: " · 当前页模型已固定"; color: #b26a00; }
    .ui-config-field.is-current-unavailable span::after { content: " · 当前页无此组件"; color: #8a91a3; }
    .ui-config-field.is-partial:not(.is-locked) span::after { content: " · 部分组件已固定"; color: #b26a00; }
    .ui-config-field input, .ui-config-field select { width: 100%; min-height: 36px; padding: 7px 9px; border: 1px solid #d8dce4; border-radius: 8px; color: var(--ink); background: #fff; }
    .ui-config-field input[type="color"] { padding: 3px; }
    .ui-config-field input:disabled, .ui-config-field select:disabled { color: #8a91a3; background: #f1f3f6; cursor: not-allowed; }
    .ui-config-field.is-invalid input, .ui-config-field.is-invalid select { border-color: #c03245; box-shadow: 0 0 0 2px rgba(192,50,69,.1); }
    .ui-config-error { color: #c03245; font-size: 10px; line-height: 1.35; }
    .ui-config-status.is-error { color: #c03245; font-weight: 700; }
    .ui-config-actions { border-top: 1px solid var(--line); border-bottom: 0; }
    .ui-config-actions > div { display: flex; gap: 8px; }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 22px;
      padding: 9px 13px;
      border-radius: 8px;
      color: #fff;
      background: #25293b;
      box-shadow: var(--shadow);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: 180ms ease;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    .left-panel { grid-column: 1; }
    [data-resizer="left"] { grid-column: 2; }
    .canvas-panel { grid-column: 3; }
    [data-resizer="right"] { grid-column: 4; }
    .right-panel { grid-column: 5; }
    .floating-mode .canvas-panel { grid-column: 1; }
    .page-actions { display: flex; align-items: center; gap: 6px; }
    #page-select { max-width: 180px; }
    .annotation-heading { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
    .annotation-edit { border: 0; padding: 2px 4px; color: var(--accent); background: transparent; font-size: 11px; cursor: pointer; }
    .markdown-preview img { display: block; max-width: 100%; height: auto; margin: 8px 0; }
    .annotation-content { font-size: 11px; }
    .annotation-content p { white-space: normal; }
    #annotation-editor-dialog { width: min(620px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    #annotation-editor-dialog::backdrop { background: rgba(23,32,51,.4); }
    #annotation-editor-dialog h2 { margin: 0 0 12px; font-size: 18px; }
    #annotation-editor-dialog label { display: block; margin: 12px 0; font-size: 12px; }
    #annotation-editor-dialog input, #annotation-editor-dialog textarea { display: block; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; font: 13px/1.6 monospace; }
    .annotation-editor-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    #annotation-editor-close { background: #2563eb; border-color: #2563eb; color: #fff; }
    .product-hidden .workspace { grid-template-columns: 0 0 minmax(0, 1fr) 7px var(--right-width); }
    .annotations-hidden .workspace { grid-template-columns: var(--left-width) 7px minmax(0, 1fr) 0 0; }
    .product-hidden.annotations-hidden .workspace { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
    .product-hidden .left-panel, .product-hidden [data-resizer="left"],
    .annotations-hidden .right-panel, .annotations-hidden [data-resizer="right"] { display: none; }
    .floating-mode .workspace { grid-template-columns: minmax(0, 1fr); }
    .topbar { overflow-x: auto; }
    .topbar-actions { flex-shrink: 0; }

    #markdown-preview .mermaid-diagram, #markdown-preview img { cursor: zoom-in; }
    #flow-viewer { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; background: #f5f6fa; color: var(--ink); }
    #flow-viewer[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    #flow-viewer::backdrop { background: #171a2b; }
    .flow-viewer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .flow-viewer-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #flow-viewport { display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 24px; }
    #flow-viewer-image { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; }
    .flow-viewer-tip { font-size: 12px; color: var(--muted); }

    @media (max-width: 980px) {
      :root { --left-width: 300px; --right-width: 300px; }
      .workspace { grid-template-columns: var(--left-width) 6px minmax(0, 1fr) 6px var(--right-width); }
      .brand-subtitle, .save-state { display: none; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell" data-visual-prd-container="standard">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="brand-logo.png" width="40" height="40" alt="Visual PRD">
        <div class="brand-copy">
          <div class="brand-title">Visual PRD</div>
          <div class="brand-subtitle">原型、需求与标注的同一事实源</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="save-state" class="save-state" aria-live="polite">已载入离线文档</span>
        <button id="ui-config-open" class="button button-dark" type="button" aria-expanded="false" aria-controls="ui-configurator" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
          <span>界面规范</span>
        </button>
        <button id="mode-toggle" class="button button-dark" type="button" data-review-mode-toggle aria-pressed="false" title="切换为浮动标注">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg>

          let listType = "";
          let inCode = false;
          let codeLanguage = "";
          let codeLines = [];
          const closeList = () => { if (listType) { output.push(`</${listType}>`); listType = ""; } };
          const closeCode = () => {
            output.push(codeLanguage === "mermaid"
              ? `<div class="mermaid-diagram"><pre class="mermaid-source">${codeLines.join("\n")}</pre></div>`
              : `<pre><code>${codeLines.join("\n")}</code></pre>`);
            codeLines = [];
          };

          for (let index = 0; index < lines.length; index += 1) {
            const line = lines[index];
            if (line.startsWith("```")) {
              closeList();
              if (inCode) closeCode();
              else codeLanguage = line.slice(3).trim().toLowerCase();
              inCode = !inCode;
              continue;
            }
            if (inCode) { codeLines.push(line); continue; }
            if (!line.trim()) { closeList(); continue; }
            if (line.trimStart().startsWith("|") && isTableSeparator(lines[index + 1] || "")) {
              closeList();
              const table = renderTable(lines, index);
              output.push(table.html);
              index = table.nextIndex - 1;
              continue;
            }
            const heading = line.match(/^(#{1,6})\s+(.+)$/);
            if (heading) { closeList(); const level = heading[1].length; output.push(`<h${level}>${renderInline(heading[2])}</h${level}>`); continue; }
            if (/^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})$/.test(line)) { closeList(); output.push("<hr>"); continue; }
            const unordered = line.match(/^\s*[-*]\s+(.+)$/);
            if (unordered) { if (listType !== "ul") { closeList(); listType = "ul"; output.push("<ul>"); } output.push(`<li>${renderInline(unordered[1])}</li>`); continue; }
            const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
            if (ordered) { if (listType !== "ol") { closeList(); listType = "ol"; output.push("<ol>"); } output.push(`<li>${renderInline(ordered[1])}</li>`); continue; }
            const quote = line.match(/^&gt;\s?(.+)$/);
            if (quote) { closeList(); output.push(`<blockquote>${renderInline(quote[1])}</blockquote>`); continue; }
            closeList();
            output.push(`<p>${renderInline(line)}</p>`);
          }
          closeList();
          if (inCode) closeCode();
          return output.join("\n");
        }
      };

      async function renderMarkdownPreview(markdown) {
        const current = ++previewRevision;
        preview.innerHTML = offlineMarkdown.parse(markdown);
        if (preview.hidden) return;
        for (const source of $$(".mermaid-source", preview)) {
          if (current !== previewRevision) return;
          const host = document.createElement("div");
          host.dataset.mermaidRenderHost = "";
          host.style.cssText = "position:absolute;left:-100000px;top:0;visibility:hidden";
          document.body.append(host);
          try {
            if (!window.mermaid) throw new Error("Mermaid runtime unavailable");
            const { svg } = await window.mermaid.render(`vprd-flow-${++diagramSequence}`, source.textContent, host);
            if (current === previewRevision) source.parentElement.innerHTML = svg;
          } catch (error) {
            if (current === previewRevision) {
              const message = document.createElement("p");
              message.className = "mermaid-error";
              message.textContent = "流程图未能渲染，请切换“编辑”检查 Mermaid 语法。";
              source.before(message);
            }
          } finally { host.remove(); }
        }
      }

      function decodeBase64(payload) {
        if (!payload || payload.startsWith("__VISUAL_PRD_")) return "";
        try {
          const bytes = Uint8Array.from(atob(payload.replace(/\s/g, "")), char => char.charCodeAt(0));
          return new TextDecoder("utf-8").decode(bytes);
        } catch (error) {
          console.warn("Visual PRD payload decode failed", error);
          return "";
        }
      }

      function selectMarkdownSections(source, patterns, label = "产品需求文档") {
        const lines = source.split("\n");
        const sections = [];
        let context = "";
        for (let index = 0; index < lines.length; index++) {
          const heading = lines[index].match(/^(#{2,6})\s+(.+)$/);
          const bold = lines[index].match(/^\*\*([^*]+)\*\*\s*$/);
          if (heading) context = lines[index];
          if (!(heading || bold) || !patterns.some(pattern => pattern.test(heading?.[2] || bold[1]))) continue;
          let end = index + 1;
          while (end < lines.length) {
            const next = lines[end].match(/^(#{1,6})\s+/);
            if (next && (!heading || next[1].length <= heading[1].length)) break;
            if (bold && /^\*\*[^*]+\*\*\s*$/.test(lines[end])) break;
            end++;
          }
          sections.push((bold && context ? context + "\n\n" : "") + lines.slice(index, end).join("\n"));
          index = end - 1;
        }
        const title = source.match(/^#\s+.+$/m)?.[0] || `# ${label}`;
        return title + "\n\n" + (sections.join("\n\n") || "待补充：原始需求材料未提供本栏内容，相关规则待确认。");
      }

      function reviewSnapshot() {
        return { docs: state.docs, annotations: state.annotations, activeDoc: state.activeDoc,
          mode: state.mode, leftWidth: state.leftWidth, rightWidth: state.rightWidth,
          productHidden: state.productHidden, annotationsHidden: state.annotationsHidden,
          uiProfile: uiConfigurator?.getProfile() || state.uiProfile, savedAt: state.savedAt };
      }

      function reviewHtml(snapshot = reviewSnapshot()) {
        const root = document.documentElement.cloneNode(true);
        root.querySelector("#review-state").textContent = JSON.stringify(snapshot).replace(/</g, "\\u003c");
        root.querySelector("#annotation-editor-dialog").removeAttribute("open");
        root.querySelector("#flow-viewer").removeAttribute("open");
        root.querySelector("#flow-viewer-image").removeAttribute("src");
        root.querySelector("#prototype-frame").removeAttribute("srcdoc");
        root.querySelector("#ui-configurator").hidden = true;
        root.querySelector("#app").inert = false;
        root.querySelector("#markdown-preview").replaceChildren();
        root.querySelectorAll("[data-mermaid-render-host]").forEach(host => host.remove());
        return "<!doctype html>\n" + root.outerHTML;
      }

      function database() {
        if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open("visual-prd-reviews", 1);
          request.onupgradeneeded = () => request.result.createObjectStore("reviews");
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return dbPromise;
      }

      async function storedValue(key, value) {
        const db = await database();
        return new Promise((resolve, reject) => {
          const writing = value !== undefined;
          const tx = db.transaction("reviews", writing ? "readwrite" : "readonly");
          const store = tx.objectStore("reviews");
          const request = writing ? store.put(value, key) : store.get(key);
          tx.oncomplete = () => resolve(request.result);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      }

      async function loadPersistedState() {
        const embedded = JSON.parse($("#review-state").textContent || "null");
        let saved = embedded;
        try {
          const draft = await storedValue(STORAGE_KEY);
          if (draft && (!saved || draft.savedAt > saved.savedAt)) saved = draft;
          fileHandle = await storedValue(STORAGE_KEY + ":file");
        } catch (_) { /* Browser drafts remain available below. */ }
        // Read original localStorage drafts even when IndexedDB is available.
        try {
          const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (draft && (!saved || draft.savedAt > saved.savedAt)) saved = draft;
        } catch (_) { /* Embedded HTML and IndexedDB remain available. */ }
        if (saved && (!embedded || saved.savedAt > embedded.savedAt)) revision = 1;
        if (saved) {
          state.docs = { ...state.docs, ...saved.docs };
          if (Array.isArray(saved.annotations)) state.annotations = saved.annotations;
          if (saved.activeDoc && state.docs[saved.activeDoc]) state.activeDoc = saved.activeDoc;
          if (["review", "floating"].includes(saved.mode)) state.mode = saved.mode;
          if (Number.isFinite(saved.leftWidth)) state.leftWidth = saved.leftWidth;
          if (Number.isFinite(saved.rightWidth)) state.rightWidth = saved.rightWidth;
          for (const key of ["productHidden", "annotationsHidden", "uiProfile", "savedAt"]) {
            if (saved[key] !== undefined) state[key] = saved[key];
          }
        }
        $("#disk-save").textContent = window.showOpenFilePicker ? "授权自动写回" : "下载评审副本";
        if (window.showOpenFilePicker && fileHandle) $("#disk-save").textContent = "重新授权写回";
        $("#save-state").textContent = "已载入文档；请授权磁盘写回";
        if (fileHandle && await fileHandle.queryPermission({ mode: "readwrite" }) === "granted") {
          $("#disk-save").textContent = "更换写回文件";
          $("#save-state").textContent = "已恢复自动写回：" + fileHandle.name;
        }
      }

      function persistState() {
        state.savedAt = new Date().toISOString();
        revision += 1;
        $("#save-state").textContent = "保存中…";
        return flushSave();
      }

      function flushSave() {
        const currentRevision = revision;
        const targetHandle = fileHandle;
        saveQueue = saveQueue.catch(() => {}).then(async () => {
          if (currentRevision !== revision) return;
          const snapshot = JSON.parse(JSON.stringify(reviewSnapshot()));
          const html = reviewHtml(snapshot);
          let draftSaved = false;
          try { await storedValue(STORAGE_KEY, snapshot); draftSaved = true; }
          catch (_) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); draftSaved = true; }
            catch (_) { /* report below; never claim a disk save */ }
          }
          let status = draftSaved ? "草稿已存；尚未写回磁盘" : "保存失败；请授权写回磁盘";
          if (targetHandle) {
            try {
              if (await targetHandle.queryPermission({ mode: "readwrite" }) !== "granted") {
                status = "需要重新授权磁盘写回";
                $("#disk-save").textContent = "重新授权写回";
              } else {
                const writable = await targetHandle.createWritable();
                try { await writable.write(html); await writable.close(); }
                catch (error) { await writable.abort().catch(() => {}); throw error; }
                diskRevision = currentRevision;
                status = "已自动写回：" + targetHandle.name;
                $("#disk-save").textContent = "更换写回文件";
              }
            } catch (error) { status = "磁盘写回失败：" + error.message; }
          }
          if (revision === currentRevision) $("#save-state").textContent = status;
        });
        return saveQueue;
      }

      async function authorizeDiskSave() {
        try {
          if (!window.showOpenFilePicker) {
            downloadBlob(new Blob([reviewHtml()], { type: "text/html;charset=utf-8" }), "visual-prd-review.html");
            showToast("此浏览器不支持自动写回，请使用 Chrome/Edge；当前已下载评审副本");
            return;
          }
          if (fileHandle && await fileHandle.queryPermission({ mode: "readwrite" }) === "prompt") {
            if (await fileHandle.requestPermission({ mode: "readwrite" }) !== "granted") {
              showToast("未获写回授权，修改仍保留为本地草稿");
              return;
            }
          } else {
            const [selected] = await window.showOpenFilePicker({ multiple: false,
              types: [{ description: "正在编辑的已有 PRD HTML", accept: { "text/html": [".html"] } }] });
            if (await selected.requestPermission({ mode: "readwrite" }) !== "granted") {
              showToast("未获写回授权，请重新选择当前 HTML；已有写回目标保持不变");
              return;
            }
            fileHandle = selected;
          }
          await storedValue(STORAGE_KEY + ":file", fileHandle).catch(() => {});
          await persistState();
        } catch (error) {
          if (error.name !== "AbortError") showToast("授权失败：" + error.message);
        }
      }

      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
      }

      function renderDocNavigation() {
        $("#doc-navigation").innerHTML = DOC_META.map(item => `
          <button class="doc-tab" type="button" data-doc-id="${item.id}" aria-selected="${item.id === state.activeDoc}">${item.label}</button>
        `).join("");
      }

      function renderDocument() {
        const meta = DOC_META.find(item => item.id === state.activeDoc);
        const markdown = state.docs[state.activeDoc] || "";
        renderDocNavigation();
        $("#doc-context").textContent = meta?.context || "产品说明";
        editor.textContent = markdown;
        editor.hidden = state.docMode !== "edit";
        preview.hidden = state.docMode !== "preview";
        renderMarkdownPreview(markdown);
        $$('[data-doc-mode]').forEach(button => button.setAttribute("aria-pressed", String(button.dataset.docMode === state.docMode)));
      }

      function setMode(mode) {
        state.mode = mode;
        const floating = mode === "floating";
        app.classList.toggle("floating-mode", floating);
        const button = $("#mode-toggle");
        button.setAttribute("aria-pressed", String(floating));
        const targetLabel = floating ? "切换为三栏评审" : "切换为浮动标注";
        button.querySelector("span").textContent = targetLabel;
        button.title = targetLabel;
        button.setAttribute("aria-label", targetLabel);
        requestAnnotationPosition();
        persistState();
      }

      function visibleAnnotations() {
        const runtime = prototypeRuntime();
        if (runtime) {
          const visibleIds = new Set(runtime.getState().visibleIds || []);
          return state.annotations.filter(annotation => visibleIds.has(annotation.id));
        }
        return state.annotations.filter(annotation => {
          if (annotation.pageId !== "*" && annotation.pageId !== state.pageId) return false;
          if (state.modalId) return annotation.scope === "modal" && annotation.scopeId === state.modalId;
          if (annotation.scope === "modal") return false;
          if (annotation.scope === "tab") return annotation.scopeId === state.tabId;
          return annotation.scope === "page";
        });
      }

      function annotationNumber(annotation) {
        return annotation.order;
      }

      function assertAnnotationNumberMatch(annotation, panelNumber) {
        if (!DEV_ASSERTIONS) return;
        const prototypeNumber = prototypeRuntime()?.getRenderedNumber(annotation.id);
        if (prototypeNumber != null && prototypeNumber !== panelNumber) {
          console.warn(`[VisualPRD] Annotation number mismatch for data-anno="${annotation.id}": prototype=${prototypeNumber}, panel=${panelNumber}.`);
        }
      }

      function annotationById(id) {
        return state.annotations.find(item => item.id === id);
      }

      function renderAnnotations() {
        const annotations = visibleAnnotations();
        $("#annotation-count").textContent = `${annotations.length} 项`;
        const context = state.modalId ? `弹层 · ${state.modalId}` : state.tabId ? `页面 ${state.pageLabel} · Tab ${state.tabId}` : `页面 · ${state.pageLabel}`;
        $("#annotation-summary").textContent = context;
        $("#current-page").textContent = state.pageLabel;
        $("#current-scope").textContent = state.modalId ? "弹层" : state.tabId ? "Tab" : "页面";

        const list = $("#annotation-list");
        if (!annotations.length) {
          list.innerHTML = '<div class="empty-state">当前上下文没有标注。<br>切换页面、Tab 或打开弹层后再查看。</div>';
        } else {
          list.innerHTML = annotations.map(annotation => {
            const number = annotationNumber(annotation);
            assertAnnotationNumberMatch(annotation, number);
            return `
              <article class="annotation-card ${annotation.id === state.activeAnnotationId ? "is-active" : ""}" data-annotation-id="${annotation.id}" role="button" aria-label="在原型中打开标注 ${number}：${escapeHtml(annotation.title)}" tabindex="0">
                <div class="annotation-number">${number}</div>
                <div>
                  <div class="annotation-heading"><h3>${escapeHtml(annotation.title)}</h3><button class="annotation-edit" type="button" data-edit-annotation="${annotation.id}" aria-label="编辑标注 ${number}">编辑</button></div>
                  <div class="annotation-content markdown-preview">${offlineMarkdown.parse(annotation.body)}</div>
                  <div class="annotation-rules">${(annotation.businessRules || []).map(rule => `<p>${escapeHtml(rule)}</p>`).join("")}</div>
                  <footer>
                    <span class="tag scope-${annotation.scope}">${SCOPE_LABEL[annotation.scope] || annotation.scope}</span>
                    <span class="tag">${escapeHtml(annotation.selector)}</span>
                  </footer>
                </div>
              </article>
            `;
          }).join("");
        }
        renderDots();
      }

      function frameDocument() {
        try { return frame.contentDocument || frame.contentWindow.document; } catch (_) { return null; }
      }

      function prototypeRuntime() {
        try {
          const runtime = frame.contentWindow?.AnnotationRuntime;
          return runtime?.__isVisualPrdRuntime ? runtime : null;
        } catch (_) {
          return null;
        }
      }

      function renderDots() {
        if (prototypeRuntime()) {
          layer.innerHTML = "";
          return;
        }
        layer.innerHTML = visibleAnnotations().map(annotation => `
          <button class="anno-dot ${annotation.id === state.activeAnnotationId ? "is-active" : ""}" type="button" data-annotation-id="${annotation.id}" aria-label="标注 ${annotationNumber(annotation)}：${escapeHtml(annotation.title)}">${annotationNumber(annotation)}</button>
        `).join("");
        requestAnnotationPosition();
      }

      function positionDots() {
        positionFrame = 0;
        const doc = frameDocument();
        if (!doc) return;
        const frameRect = frame.getBoundingClientRect();
        const layerRect = layer.getBoundingClientRect();
        $$(".anno-dot", layer).forEach(dot => {
          const annotation = annotationById(dot.dataset.annotationId);
          let target = null;
          try { target = doc.querySelector(annotation.selector); } catch (_) { /* invalid selector */ }
          if (!target || target.hidden || target.getClientRects().length === 0) {
            dot.hidden = true;
            return;
          }
          dot.hidden = false;
          const rect = target.getBoundingClientRect();
          const left = frameRect.left - layerRect.left + rect.right - 4;
          const top = frameRect.top - layerRect.top + rect.top + 4;
          dot.style.left = `${Math.max(12, Math.min(layerRect.width - 12, left))}px`;
          dot.style.top = `${Math.max(12, Math.min(layerRect.height - 12, top))}px`;
        });
        if (!popover.hidden && state.activeAnnotationId) positionPopover(annotationById(state.activeAnnotationId));
      }

      function requestAnnotationPosition() {
        if (positionFrame) return;
        positionFrame = requestAnimationFrame(positionDots);
      }

      function positionPopover(annotation) {
        if (!annotation) return;
        const dot = $(`.anno-dot[data-annotation-id="${CSS.escape(annotation.id)}"]`, layer);
        const stageRect = $("#canvas-stage").getBoundingClientRect();
        const anchorRect = dot && !dot.hidden ? dot.getBoundingClientRect() : stageRect;
        const width = Math.min(310, stageRect.width - 24);
        const preferredLeft = anchorRect.right - stageRect.left + 10;
        const left = Math.max(12, Math.min(stageRect.width - width - 12, preferredLeft));
        const top = Math.max(12, Math.min(stageRect.height - popover.offsetHeight - 12, anchorRect.top - stageRect.top - 8));
        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
      }

      function openAnnotation(id) {
        const annotation = annotationById(id);
        if (!annotation) return;
        state.activeAnnotationId = id;
        const runtime = prototypeRuntime();
        if (runtime?.open(id)) {
          popover.hidden = true;
          renderAnnotations();
          return;
        }
        popover.innerHTML = `
          <div class="popover-head">
            <h3 class="popover-title"><span class="popover-index">${annotationNumber(annotation)}</span>${escapeHtml(annotation.title)}</h3>
            <button class="popover-close" type="button" aria-label="关闭标注">×</button>
          </div>
          <p class="popover-body">${escapeHtml(annotation.body)}</p>
          ${annotation.businessRules?.length ? `<div class="annotation-rules"><strong>业务规则</strong><ul>${annotation.businessRules.map(rule => `<li>${escapeHtml(rule)}</li>`).join("")}</ul></div>` : ""}
          <div class="popover-meta">${SCOPE_LABEL[annotation.scope]} · ${escapeHtml(annotation.selector)}</div>
        `;
        popover.hidden = false;
        renderAnnotations();
        requestAnimationFrame(() => positionPopover(annotation));
      }

      function closeAnnotation() {
        state.activeAnnotationId = "";
        popover.hidden = true;
        renderAnnotations();
      }

      function inferPageLabel(doc, pageId) {
        const target = doc.querySelector(`[data-vprd-page-target="${CSS.escape(pageId)}"]`);
        return target?.textContent.trim() || doc.body.dataset.vprdPageLabel || pageId;
      }

      function syncPrototypeContext() {
        const doc = frameDocument();
        if (!doc?.body) return;
        state.pageId = prototypeRuntime()?.getState().pageId || doc.body.dataset.annoPage || doc.body.dataset.vprdPage || "home";
        state.pageLabel = pageCatalog.find(page => page.id === state.pageId)?.label || inferPageLabel(doc, state.pageId);
        $("#page-select").value = state.pageId;
        $("#previous-page").disabled = pageCatalog.findIndex(page => page.id === state.pageId) <= 0;
        $("#next-page").disabled = pageCatalog.findIndex(page => page.id === state.pageId) >= pageCatalog.length - 1;
        state.tabId = doc.body.dataset.vprdTab || "";
        state.modalId = doc.body.dataset.vprdModal || "";
        uiConfigurator?.setPage(state.pageId);
        if (state.activeAnnotationId && !visibleAnnotations().some(item => item.id === state.activeAnnotationId)) closeAnnotation();
        else renderAnnotations();
      }

      function decodePrototypeRoute(hash = location.hash) {
        const match = String(hash || "").match(/^#\/page\/([^?]+)(?:\?(.*))?$/);
        if (!match) return null;
        const params = {};
        new URLSearchParams(match[2] || "").forEach((value, key) => { params[key] = value; });
        return { pageId: decodeURIComponent(match[1]), params };
      }

      function encodePrototypeRoute(route) {
        const query = new URLSearchParams(route.params || {}).toString();
        return `#/page/${encodeURIComponent(route.pageId)}${query ? `?${query}` : ""}`;
      }

      function sendParentRouteToPrototype() {
        const route = decodePrototypeRoute();
        if (route) frame.contentWindow?.postMessage({ type: "visual-prd:prototype-navigate", route }, "*");
      }

      function fitPrototypeViewport(doc) {
        // Adapt only the outer layout in the review working document; keep business widgets intact.
        const root = doc.querySelector("[data-vprd-responsive-root]") ||
          doc.body.querySelector(":scope > .shell, :scope > .app-shell, :scope > .layout, :scope > .app, :scope > #app");
        doc.documentElement.style.setProperty("width", "100%", "important");
        for (const node of [doc.documentElement, doc.body, root].filter(Boolean)) {
          node.style.setProperty("min-width", "0", "important");
          node.style.setProperty("max-width", "none", "important");
        }
        doc.body.style.setProperty("width", "auto", "important");
        if (root) {
          root.style.setProperty("width", "100%", "important");
          root.style.setProperty("box-sizing", "border-box", "important");
        }
      }

      function wirePrototype() {
        const doc = frameDocument();
        if (!doc?.body) return;

        const runtime = prototypeRuntime();
        runtime?.init({
          annotations: state.annotations.map(annotation => ({
            id: annotation.id,
            order: annotation.order,
            pageId: annotation.pageId,
            title: annotation.title,
            body: annotation.body,
            businessRules: annotation.businessRules || [],
            scope: { type: annotation.scope, id: annotation.scopeId },
          })),
          pageId: () => doc.body.dataset.annoPage || doc.body.dataset.vprdPage || state.pageId,
        });

        doc.addEventListener("click", event => {
          const target = event.target;
          const pageTarget = target.closest("[data-vprd-page-target]");
          if (pageTarget) {
            const nextPage = pageTarget.dataset.vprdPageTarget;
            $$('[data-vprd-page-target]', doc).forEach(node => node.classList.toggle("active", node === pageTarget));
            $$('[data-vprd-page]', doc).filter(node => node.classList.contains("demo-page")).forEach(node => { node.hidden = node.dataset.vprdPage !== nextPage; });
            doc.body.dataset.vprdPage = nextPage;
            doc.body.dataset.vprdTab = nextPage === "home" ? "overview" : "";
          }

          const tabTarget = target.closest("[data-vprd-tab]");
          if (tabTarget) {
            $$('[data-vprd-tab]', doc).forEach(node => node.classList.toggle("active", node === tabTarget));
            doc.body.dataset.vprdTab = tabTarget.dataset.vprdTab;
          }

          const modalTarget = target.closest("[data-vprd-open-modal]");
          if (modalTarget) {
            const dialog = doc.getElementById(modalTarget.dataset.vprdOpenModal);
            if (dialog?.showModal) dialog.showModal(); else if (dialog) dialog.setAttribute("open", "");
            doc.body.dataset.vprdModal = dialog?.dataset.vprdModal || modalTarget.dataset.vprdOpenModal;
          }

          const closeTarget = target.closest("[data-vprd-close-modal]");
          if (closeTarget) {
            const dialog = closeTarget.closest("dialog");
            if (dialog?.close) dialog.close(); else dialog?.removeAttribute("open");
            delete doc.body.dataset.vprdModal;
          }

          window.setTimeout(() => {
            syncPrototypeContext();
          }, 0);
        }, true);

        doc.addEventListener("scroll", requestAnnotationPosition, true);
        doc.addEventListener("annotation-runtime:updated", syncPrototypeContext);
        frame.contentWindow.addEventListener("resize", requestAnnotationPosition);
        try {
          if ("ResizeObserver" in frame.contentWindow) new frame.contentWindow.ResizeObserver(requestAnnotationPosition).observe(doc.body);
        } catch (_) {
          // Some srcdoc implementations reject cross-document observer targets.
          // Scroll, resize and the prototype's own annotation runtime still keep positions fresh.
        }
        uiConfigurator?.apply();
        fitPrototypeViewport(doc);
        syncAnnotationDefinitions();
        renderPageCatalog();
        syncPrototypeContext();
        sendParentRouteToPrototype();
      }

      function loadPrototype() {
        closeAnnotation();
        const injected = decodeBase64(PROTOTYPE_PAYLOAD);
        frame.srcdoc = injected || DEFAULT_PROTOTYPE;
      }

      function installResizers() {
        $$("[data-resizer]").forEach(handle => {
          handle.addEventListener("pointerdown", event => {
            if (state.mode === "floating") return;
            event.preventDefault();
            handle.setPointerCapture(event.pointerId);
            handle.classList.add("is-dragging");
            const side = handle.dataset.resizer;
            const startX = event.clientX;
            const startWidth = side === "left" ? state.leftWidth : state.rightWidth;

            const onMove = moveEvent => {
              const delta = moveEvent.clientX - startX;
              const width = Math.max(260, Math.min(560, startWidth + (side === "left" ? delta : -delta)));
              state[side === "left" ? "leftWidth" : "rightWidth"] = width;
              document.documentElement.style.setProperty(`--${side}-width`, `${width}px`);
              requestAnnotationPosition();
            };
            const onUp = upEvent => {
              handle.releasePointerCapture(upEvent.pointerId);
              handle.classList.remove("is-dragging");
              handle.removeEventListener("pointermove", onMove);
              handle.removeEventListener("pointerup", onUp);
              persistState();
            };
            handle.addEventListener("pointermove", onMove);
            handle.addEventListener("pointerup", onUp);
          });
        });
      }

      function renderPanelVisibility() {
        app.classList.toggle("product-hidden", state.productHidden);
        app.classList.toggle("annotations-hidden", state.annotationsHidden);
        for (const [id, hidden, label] of [["product", state.productHidden, "产品说明"], ["annotations", state.annotationsHidden, "页面标注"]]) {
          const button = $("#toggle-" + id);
          button.textContent = (hidden ? "开启" : "关闭") + label;
          button.setAttribute("aria-expanded", String(!hidden));
        }
        requestAnnotationPosition();
      }

      function syncAnnotationDefinitions() {
        prototypeRuntime()?.update({ upsert: state.annotations.map(item => ({ ...item,
          scope: { type: item.scope, id: item.scopeId } })) });
      }

      function editAnnotation(id) {
        const annotation = annotationById(id);
        if (!annotation) return;
        editingAnnotationId = id;
        $("#annotation-title").value = annotation.title;
        $("#annotation-body").value = annotation.body;
        $("#annotation-rules").value = (annotation.businessRules || []).join("\n");
        $("#annotation-editor-preview").innerHTML = offlineMarkdown.parse(annotation.body);
        $("#annotation-editor-dialog").showModal();
        $("#annotation-title").focus();
      }

      function updateEditedAnnotation() {
        const annotation = annotationById(editingAnnotationId);
        if (!annotation) return;
        annotation.title = $("#annotation-title").value;
        annotation.body = $("#annotation-body").value;
        annotation.businessRules = $("#annotation-rules").value.split("\n").filter(line => line.trim());
        $("#annotation-editor-preview").innerHTML = offlineMarkdown.parse(annotation.body);
        syncAnnotationDefinitions();
        renderAnnotations();
        persistState();
      }

      function pasteMarkdown(event, target, update) {
        const imageFiles = [...(event.clipboardData?.items || [])]
          .filter(item => /^image\/(png|jpeg|gif|webp)$/.test(item.type)).map(item => item.getAsFile());
        if (!imageFiles.length) {
          if (target === editor) {
            event.preventDefault();
            document.execCommand("insertText", false, event.clipboardData?.getData("text/plain") || "");
          }
          return;
        }
        event.preventDefault();
        // Reserve the insertion point immediately, so async reads cannot target another document/card.
        const tokens = imageFiles.map(() => `![图片读取中-${crypto.randomUUID()}]()`);
        const text = "\n" + tokens.join("\n") + "\n";
        if (target === editor) document.execCommand("insertText", false, text);
        else target.setRangeText(text, target.selectionStart, target.selectionEnd, "end");
        update();
        imageFiles.forEach((file, index) => {
          const reader = new FileReader();
          reader.onload = () => update(tokens[index], `![流程或说明图片](${reader.result})`);
          reader.onerror = () => { update(tokens[index], "[图片读取失败]"); showToast("图片读取失败，请重试"); };
          reader.readAsDataURL(file);
        });
      }

      function renderPageCatalog() {
        const doc = frameDocument();
        pageCatalog = [...doc.querySelectorAll("[data-page], .demo-page[data-vprd-page]")].map(node => ({
          id: node.dataset.page || node.dataset.vprdPage,
          nativeRoute: Boolean(frame.contentWindow.__proto?.navigate),
          label: node.dataset.pageLabel || node.querySelector("h1, h2")?.textContent.trim() || node.dataset.page || node.dataset.vprdPage
        })).filter((page, index, all) => all.findIndex(item => item.id === page.id) === index);
        if (!pageCatalog.length) pageCatalog = [{
          id: doc.body.dataset.annoPage || doc.body.dataset.vprdPage || "page",
          label: doc.querySelector("h1, h2")?.textContent.trim() || doc.title || "当前页面",
          nativeRoute: false
        }];
        $("#page-select").innerHTML = pageCatalog.map(page => `<option value="${escapeHtml(page.id)}">${escapeHtml(page.label)}</option>`).join("");
      }

      function navigatePage(id) {
        if (!pageCatalog.some(page => page.id === id)) return;
        if (frame.contentWindow.__proto?.navigate) frame.contentWindow.__proto.navigate(id);
        else frameDocument().querySelector(`[data-vprd-page-target="${CSS.escape(id)}"]`)?.click();
      }

      function downloadBlob(blob, name) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url; link.download = name; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }

      function developerHtml(page) {
        const source = decodeBase64(DEVELOPER_PAYLOAD);
        if (!source) throw new Error("请使用新版 build-container.py 重新构建，以生成无标注的开发源码");
        // Keep all shared page definitions/handlers; change only the standalone entry route.
        const route = JSON.stringify("#/page/" + encodeURIComponent(page.id)).replace(/</g, "\\u003c");
        const target = JSON.stringify(`[data-vprd-page-target="${CSS.escape(page.id)}"]`).replace(/</g, "\\u003c");
        const entry = page.nativeRoute
          ? `<script>if (!location.hash) history.replaceState(null, '', ${route});<\/script>`
          : `<script>addEventListener("DOMContentLoaded", () => document.querySelector(${target})?.click(), { once: true });<\/script>`;
        return source.replace(/<head[^>]*>/i, match => match + entry);
      }

      function pageFilename(page, index) {
        return `${String(index + 1).padStart(2, "0")}-${page.id.replace(/[^a-zA-Z0-9_\u4e00-\u9fff-]/g, "_")}.html`;
      }

      // ZIP STORE records: no CDN/library and no network dependency.
      function zipPages(files) {
        const encoder = new TextEncoder();
        const parts = [], directory = [];
        let offset = 0, directorySize = 0;
        function record(size) { const bytes = new Uint8Array(size); return [bytes, new DataView(bytes.buffer)]; }
        function crc32(bytes) {
          let crc = 0xffffffff;
          for (const byte of bytes) {
            crc ^= byte;
            for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
          }
          return (crc ^ 0xffffffff) >>> 0;
        }
        for (const file of files) {
          const name = encoder.encode(file.name), data = encoder.encode(file.html), crc = crc32(data);
          const [local, l] = record(30);
          l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint16(6, 0x800, true);
          l.setUint16(12, 33, true); l.setUint32(14, crc, true); l.setUint32(18, data.length, true);
          l.setUint32(22, data.length, true); l.setUint16(26, name.length, true);
          parts.push(local, name, data);
          const [central, c] = record(46);
          c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
          c.setUint16(8, 0x800, true); c.setUint16(14, 33, true); c.setUint32(16, crc, true);
          c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
          c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
          directory.push(central, name); directorySize += 46 + name.length;
          offset += 30 + name.length + data.length;
        }
        const [end, e] = record(22);
        e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
        e.setUint32(12, directorySize, true); e.setUint32(16, offset, true);
        return new Blob([...parts, ...directory, end], { type: "application/zip" });
      }

      function installFlowViewer() {
        const dialog = $("#flow-viewer"), image = $("#flow-viewer-image");
        let scale = 1, name = "流程图", enteredFullscreen = false;
        function renderZoom() {
          image.style.transform = `scale(${scale})`;
          $("#flow-zoom").textContent = Math.round(scale * 100) + "%";
        }
        preview.addEventListener("click", event => {
          if (state.activeDoc !== "flows" || !(event.target instanceof Element)) return;
          const target = event.target.closest(".mermaid-diagram svg, img");
          if (!target) return;
          const diagrams = [...preview.querySelectorAll(".mermaid-diagram svg, img")];
          name = `流程图-${diagrams.indexOf(target) + 1}`;
          if (target.tagName.toLowerCase() === "svg") {
            const svg = target.cloneNode(true), box = target.viewBox.baseVal;
            svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            if (box.width && box.height) {
              svg.setAttribute("width", box.width); svg.setAttribute("height", box.height);
            }
            svg.style.removeProperty("max-width");
            const bytes = new TextEncoder().encode(new XMLSerializer().serializeToString(svg));
            image.src = "data:image/svg+xml;base64," + btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join(""));
          } else image.src = target.currentSrc || target.src;
          $("#flow-viewer-title").textContent = name;
          scale = 1; renderZoom(); dialog.showModal();
          dialog.requestFullscreen?.().then(() => { enteredFullscreen = true; }).catch(() => {});
        });
        $("#flow-viewport").addEventListener("wheel", event => {
          event.preventDefault();
          scale = Math.max(0.25, Math.min(8, scale * Math.exp(-event.deltaY * 0.002)));
          renderZoom();
        }, { passive: false });
        $("#flow-reset").addEventListener("click", () => { scale = 1; renderZoom(); });
        $("#flow-close").addEventListener("click", () => dialog.close());
        document.addEventListener("fullscreenchange", () => {
          if (enteredFullscreen && !document.fullscreenElement && dialog.open) dialog.close();
        });
        dialog.addEventListener("close", () => {
          enteredFullscreen = false;
          if (document.fullscreenElement === dialog) document.exitFullscreen().catch(() => {});
          image.removeAttribute("src");
        });
        $("#flow-download").addEventListener("click", async () => {
          try {
            await image.decode();
            const factor = Math.min(2, 8192 / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.naturalWidth * factor));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * factor));
            const context = canvas.getContext("2d");
            context.fillStyle = "#fff"; context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
            if (!blob) throw new Error("图片生成失败");
            downloadBlob(blob, name + ".png");
          } catch (error) { showToast("下载失败：" + error.message); }
        });
      }

      function bindReviewEvents() {
        installFlowViewer();
        for (const [id, key] of [["product", "productHidden"], ["annotations", "annotationsHidden"]]) {
          $("#toggle-" + id).addEventListener("click", () => {
            if (state.mode === "floating") setMode("review");
            state[key] = !state[key]; renderPanelVisibility(); persistState();
          });
        }
        $("#disk-save").addEventListener("click", authorizeDiskSave);
        $("#save-now").addEventListener("click", async () => {
          if (!fileHandle || await fileHandle.queryPermission({ mode: "readwrite" }) !== "granted") await authorizeDiskSave();
          else await flushSave();
        });
        $("#annotation-editor-close").addEventListener("click", async () => {
          await flushSave();
          if (fileHandle && diskRevision < revision) { showToast("写回尚未成功，请检查顶部保存状态"); return; }
          $("#annotation-editor-dialog").close();
        });
        $("#annotation-editor-dialog").addEventListener("close", () => { flushSave(); editingAnnotationId = ""; });
        for (const id of ["title", "body", "rules"]) $("#annotation-" + id).addEventListener("input", updateEditedAnnotation);
        $("#annotation-body").addEventListener("paste", event => {
          const id = editingAnnotationId;
          pasteMarkdown(event, $("#annotation-body"), (token, image) => {
            if (token) {
              const annotation = annotationById(id);
              annotation.body = annotation.body.replace(token, image);
              if (editingAnnotationId === id) $("#annotation-body").value = annotation.body;
              syncAnnotationDefinitions(); renderAnnotations(); persistState();
              if (editingAnnotationId === id) $("#annotation-editor-preview").innerHTML = offlineMarkdown.parse(annotation.body);
            } else updateEditedAnnotation();
          });
        });
        editor.addEventListener("paste", event => {
          const id = state.activeDoc;
          pasteMarkdown(event, editor, (token, image) => {
            if (token) {
              state.docs[id] = state.docs[id].replace(token, image);
              if (state.activeDoc === id) renderDocument();
              persistState();
            } else { state.docs[id] = editor.innerText; persistState(); }
          });
        });
        $("#page-select").addEventListener("change", event => navigatePage(event.target.value));
        for (const [id, delta] of [["previous", -1], ["next", 1]]) $("#" + id + "-page").addEventListener("click", () => {
          const index = pageCatalog.findIndex(page => page.id === state.pageId);
          if (pageCatalog[index + delta]) navigatePage(pageCatalog[index + delta].id);
        });
        $("#download-page").addEventListener("click", () => {
          try {
            const index = pageCatalog.findIndex(page => page.id === state.pageId), page = pageCatalog[index];
            downloadBlob(new Blob([developerHtml(page)], { type: "text/html;charset=utf-8" }), pageFilename(page, index));
          } catch (error) { showToast(error.message); }
        });
        $("#download-all").addEventListener("click", () => {
          try {
            if (!pageCatalog.length) throw new Error("原型页面尚未加载");
            downloadBlob(zipPages(pageCatalog.map((page, index) => ({ name: pageFilename(page, index), html: developerHtml(page) }))), "prototype-pages.zip");
          } catch (error) { showToast(error.message); }
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });
        window.addEventListener("beforeunload", event => {
          if (revision > diskRevision) { event.preventDefault(); event.returnValue = "修改尚未写回磁盘"; }
        });
      }

      function bindEvents() {
        $("#mode-toggle").addEventListener("click", () => { setMode(state.mode === "review" ? "floating" : "review"); persistState(); });
        bindReviewEvents();
        $("#refresh-frame").addEventListener("click", () => { loadPrototype(); showToast("原型已重新载入"); });
        frame.addEventListener("load", wirePrototype);
        $("#doc-navigation").addEventListener("click", event => {
          const button = event.target.closest("[data-doc-id]");
          if (!button) return;
          state.activeDoc = button.dataset.docId;
          renderDocument();
          persistState();
        });
        $$("[data-doc-mode]").forEach(button => button.addEventListener("click", () => {
          state.docMode = button.dataset.docMode;
          renderDocument();
          if (state.docMode === "edit") editor.focus();
        }));
        editor.addEventListener("input", () => {
          state.docs[state.activeDoc] = editor.innerText.replace(/\u00a0/g, " ");
          renderMarkdownPreview(state.docs[state.activeDoc]);
          persistState();
        });
        document.addEventListener("click", event => {
          if (event.target.closest("[data-edit-annotation]")) {
            editAnnotation(event.target.closest("[data-edit-annotation]").dataset.editAnnotation);
            return;
          }
          if (!(event.target instanceof Element)) return;
          const dot = event.target.closest(".anno-dot");
          if (dot) {
            openAnnotation(dot.dataset.annotationId);
            return;
          }
          const card = event.target.closest("#annotation-list [data-annotation-id]");
          if (card) {
            openAnnotation(card.dataset.annotationId);
            return;
          }
          if (event.target.closest("#annotation-popover")) {
            if (event.target.closest(".popover-close")) closeAnnotation();
            return;
          }
          const runtime = prototypeRuntime();
          if (runtime?.getState().activeId) runtime.close();
          if (!popover.hidden || state.activeAnnotationId) closeAnnotation();
        });
        document.addEventListener("keydown", event => {
          if (event.target.closest("button, input, textarea, [contenteditable]")) return;
          if (!["Enter", " "].includes(event.key) || !(event.target instanceof Element)) return;
          const card = event.target.closest("#annotation-list [data-annotation-id]");
          if (!card) return;
          event.preventDefault();
          openAnnotation(card.dataset.annotationId);
        });
        window.addEventListener("resize", requestAnnotationPosition);
        window.addEventListener("message", event => {
          if (event.source !== frame.contentWindow || event.data?.type !== "visual-prd:prototype-route") return;
          const route = event.data.route;
          if (!route?.pageId) return;
          const nextHash = encodePrototypeRoute(route);
          if (location.hash !== nextHash) {
            if (event.data.replace) history.replaceState(null, "", nextHash);
            else history.pushState(null, "", nextHash);
          }
          syncPrototypeContext();
        });
        window.addEventListener("popstate", sendParentRouteToPrototype);
        window.addEventListener("hashchange", sendParentRouteToPrototype);
        installResizers();
      }

      async function init() {
        const injectedPrd = decodeBase64(PRD_PAYLOAD);
        if (injectedPrd) {
          state.docs.architecture = injectedPrd;
          state.docs.requirements = selectMarkdownSections(injectedPrd, [/功能需求/, /用户故事/, /验收条件/], "功能需求");
          state.docs.roles = selectMarkdownSections(injectedPrd, [/角色/, /权限/, /用户故事/, /功能需求/], "角色权限");
          state.docs.rules = selectMarkdownSections(injectedPrd, [/业务规则/, /状态机/, /字段说明/, /待确认/], "业务规则");
          state.docs.decisions = selectMarkdownSections(injectedPrd, [/待确认/, /决策/, /待决/], "待确认与决策");
          state.docs.data = selectMarkdownSections(injectedPrd, [/数据/, /字段/, /埋点/, /指标/, /发布/, /上线/, /交付/], "数据与发布");
        }
        for (const [id, label] of [["requirements", "功能需求"], ["decisions", "待确认与决策"], ["data", "数据与发布"]]) {
          state.docs[id] ||= `# ${label}\n\n待补充：相关内容待确认。`;
        }
        state.docs.flows = decodeBase64(FLOWS_PAYLOAD) || "# 流程图\n\n在编辑模式使用 Mermaid 代码块描述节点和连线，并补充入口、角色、分支与结果的文字说明。\n\n```mermaid\ngraph TD\n  A[待确认的入口] --> B[待确认的业务步骤]\n```";
        const injectedAnnotations = decodeBase64(ANNOTATIONS_PAYLOAD);
        if (injectedAnnotations) {
          try {
            const parsed = JSON.parse(injectedAnnotations);
            if (Array.isArray(parsed)) state.annotations = parsed;
          } catch (error) {
            console.warn("Visual PRD annotation payload could not be loaded", error);
          }
        }
        await loadPersistedState();
        const injectedProfile = decodeBase64(UI_PROFILE_PAYLOAD);
        if (injectedProfile) {
          try {
            const initialProfile = state.uiProfile || JSON.parse(injectedProfile);
            uiConfigurator = window.VisualPRDUIConfigurator.create({
              frame,
              initialProfile,
              storageKey: STORAGE_KEY,
              getPageId: () => state.pageId,
              onApply(profile) {
                if (JSON.stringify(state.uiProfile) !== JSON.stringify(profile)) {
                  state.uiProfile = profile;
                  persistState();
                }
              },
              showToast
            });
          } catch (error) {
            console.warn("Visual PRD UI profile payload could not be loaded", error);
          }
        }
        document.documentElement.style.setProperty("--left-width", `${state.leftWidth}px`);
        document.documentElement.style.setProperty("--right-width", `${state.rightWidth}px`);
        bindEvents();
        renderDocument();
        setMode(state.mode);
        renderPanelVisibility();
        loadPrototype();
        if (revision) flushSave();
      }

      window.VisualPRD = {
        getState: () => JSON.parse(JSON.stringify(state)),
        getUiProfile: () => uiConfigurator?.getProfile() || null,
        setAnnotations(annotations) {
          if (!Array.isArray(annotations)) throw new TypeError("annotations must be an array");
          state.annotations = annotations;
          syncAnnotationDefinitions();
          syncPrototypeContext();
          persistState();
        },
        loadPrototype(html) { frame.srcdoc = String(html); }
      };

      init();
    })();
  </script>
</body>
</html>
